/* Android/Adivery rewarded-ad bridge.
   Rewarded placement ID is configured in AD.units.rewarded above.
   The native Android SDK must call window.onAdiveryAdResult(requestId, true)
   only after the SDK's reward-earned callback; false for close/failure.
   Never grant coins from an ad-closed callback alone. */
(function installAdiveryBridge(){
  let seq = 0;
  const pending = new Map();
  window.onAdiveryAdResult = function(id, success) {
    const resolve = pending.get(String(id));
    if (!resolve) return;
    pending.delete(String(id));
    resolve(success === true || success === 'true');
  };
  function request(kind, options) {
    return new Promise(resolve => {
      const native = window.AdiveryBridge;
      if (!native) { resolve(false); return; }
      const id = String(++seq);
      pending.set(id, resolve);
      try {
        const unit = String((options && options.unit) || '');
        if (kind === 'rewarded' && typeof native.showRewardedAd === 'function') native.showRewardedAd(id, unit);
        else if (kind === 'interstitial' && typeof native.showInterstitialAd === 'function') native.showInterstitialAd(id, unit);
        else { pending.delete(id); resolve(false); return; }
      } catch (e) { pending.delete(id); resolve(false); return; }
      setTimeout(() => { if (pending.has(id)) { pending.delete(id); resolve(false); } }, 120000);
    });
  }
  window.PlayAds = window.PlayAds || {};
  window.PlayAds.rewarded = opts => request('rewarded', opts);
  window.PlayAds.interstitial = opts => request('interstitial', opts);
})();
